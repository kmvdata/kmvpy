[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kmvpy"
dynamic = ["version"]
authors = [
    {name = "kermit.mei", email = "kermit.mei@gmail.com"}
]
maintainers = [
    {name = "kermit.mei", email = "kermit.mei@gmail.com"}
]
description = "基于 FastAPI 的服务端基础库：YAML 配置、异步 SQLAlchemy 领域层、统一响应与异常、JWT、APScheduler 调度、Socket.IO，以及工程脚手架（Python + 前端 + 冒烟测试模板）。"
readme = {file = "README.md", content-type = "text/markdown"}
# SPDX（PEP 639）；完整文本随包分发见 license-files
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["fastapi", "sqlalchemy", "jwt", "socketio", "apscheduler", "asgi", "scaffold"]

# 默认依赖：含 Web/SocketIO、SQLite+PostgreSQL、Redis、Cassandra、OpenAI 与 PyJWT 等。
# MySQL（mysqlclient / aiomysql）见可选依赖 [mysql]。
dependencies = [
    "python-i18n>=0.3.9",
    "Deprecated>=1.3.1",
    "APScheduler>=3.11.2",
    "PyYAML>=6.0.3",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.21",
    "pycryptodome>=3.23.0",
    "pydantic>=2.12.5",
    "SQLAlchemy>=2.0.45",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "cassandra-driver>=3.29.3",
    "redis>=7.1.0",
    "fastapi-socketio>=0.0.10",
    "aiofiles>=25.1.0",
    "openai>=1.65.5",
    "PyJWT>=2.10.1",
    "cryptography>=46.0.0",
]

[project.urls]
Homepage = "https://github.com/kmvdata/kmvpy"
Repository = "https://github.com/kmvdata/kmvpy"
Issues = "https://github.com/kmvdata/kmvpy/issues"
Documentation = "https://github.com/kmvdata/kmvpy#readme"

[project.optional-dependencies]
mysql = [
    "SQLAlchemy>=2.0.45",
    "mysqlclient>=2.2.7",
    "aiomysql>=0.3.2",
    "redis>=7.1.0",
]

[project.scripts]
kmvpy = "kmvpy.generator.cli:main"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["kmvpy", "kmvpy.*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "kmvpy.__version__"}
