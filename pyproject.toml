[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kmvpy"
dynamic = ["version"]
authors = [
    {name = "kermit.mei", email = "kermit.mei@gmail.com"}
]
maintainers = [
    {name = "kermit.mei", email = "kermit.mei@gmail.com"}
]
description = "FastAPI-based server-side foundation library: YAML configuration, async SQLAlchemy domain layer, unified response and exception handling, JWT, APScheduler scheduling, Socket.IO, and an engineering scaffold (Python + frontend + smoke-test templates)."
readme = {file = "README.md", content-type = "text/markdown"}
# SPDX（PEP 639）；完整文本随包分发见 license-files
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["fastapi", "sqlalchemy", "jwt", "socketio", "apscheduler", "asgi", "scaffold"]

# Web/Socket.IO、异步 SQLite/PostgreSQL、Redis 与非对称 JWT。
# MySQL、表单/上传、测试及构建工具分别通过 extras 安装。
dependencies = [
    "python-i18n>=0.3.9,<0.4",
    "APScheduler>=3.11.3,<4",
    "PyYAML>=6.0.3,<7",
    "fastapi>=0.162.0,<0.163",
    "uvicorn>=0.54.0,<0.55",
    "websockets>=16,<18",
    "pydantic>=2.14.3,<3",
    "SQLAlchemy[asyncio]>=2.0.57,<2.1",
    "aiosqlite>=0.22.1,<0.23",
    "asyncpg>=0.32.0,<0.33",
    "redis>=7.4.1,<8",
    "python-socketio>=5.18.1,<6",
    "PyJWT>=2.15.1,<3",
    # Intel macOS is a legacy compatibility exception; see docs/DEPENDENCIES.md.
    "cryptography>=48.0.1,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=50.0.2,<51; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tzdata>=2026.6",
]

[project.urls]
Homepage = "https://github.com/kmvdata/kmvpy"
Repository = "https://github.com/kmvdata/kmvpy"
Issues = "https://github.com/kmvdata/kmvpy/issues"
Documentation = "https://github.com/kmvdata/kmvpy#readme"

[project.optional-dependencies]
mysql = [
    "aiomysql>=0.3.2,<0.4",
]
multipart = [
    "python-multipart>=0.0.33,<0.1",
]
test = [
    "pytest>=9.0.2,<10",
    "httpx>=0.28.1,<1",
    "python-socketio[asyncio-client]>=5.18.1,<6",
]
dev = [
    "build>=1.4,<2",
    "twine>=6,<8",
]

[project.scripts]
kmvpy = "kmvpy.generator.cli:main"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["kmvpy", "kmvpy.*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "kmvpy.__version__"}
