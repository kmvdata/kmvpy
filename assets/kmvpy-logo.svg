<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">蓝黄双蛇 · 太极相抱</title>
  <desc id="logo-desc">两条蓝黄小蛇首尾相衔，组成太极圆形；圆眼睛带有高光，嘴角微笑。外围为向透明渐隐的白色边框，画布透明。全部由矢量路径、圆形和原生 SVG 渐变组成。</desc>
  <defs>
    <linearGradient id="snake-blue" x1="220" y1="170" x2="660" y2="870" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#146591"/>
      <stop offset="0.5" stop-color="#075183"/>
      <stop offset="1" stop-color="#063E6C"/>
    </linearGradient>
    <linearGradient id="snake-yellow" x1="345" y1="180" x2="830" y2="815" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFDE38"/>
      <stop offset="0.55" stop-color="#FFD21B"/>
      <stop offset="1" stop-color="#FFC80B"/>
    </linearGradient>
    <radialGradient id="white-edge" cx="512" cy="512" r="468" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.9402" stop-color="#FFFFFF"/>
      <stop offset="0.9530" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="0.9658" stop-color="#FFFFFF" stop-opacity="0.74"/>
      <stop offset="0.9829" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Native vector gradient: a white rim fading outward into transparency. -->
  <circle id="outer-white-rim" cx="512" cy="512" r="468" fill="url(#white-edge)"/>

  <!-- The underlay prevents an antialiasing hairline along the shared boundary. -->
  <circle cx="512" cy="512" r="440" fill="url(#snake-yellow)"/>

  <g id="yellow-snake">
    <path id="yellow-body" fill="url(#snake-yellow)" d="M732 893.051178
      C571 986 357 862 338 711
      C324 617 363 550 433 524
      C455 516 480 512 512 512
      C544 512 569 508 591 500
      C661 474 700 407 686 313
      C667 162 453 38 292 130.948822
      A440 440 0 0 1 732 893.051178Z"/>
  </g>

  <g id="blue-snake">
    <path id="blue-body" fill="url(#snake-blue)" d="M292 130.948822
      C453 38 667 162 686 313
      C700 407 661 474 591 500
      C569 508 544 512 512 512
      C480 512 455 516 433 524
      C363 550 324 617 338 711
      C357 862 571 986 732 893.051178
      A440 440 0 0 1 292 130.948822Z"/>

    <g id="blue-face">
      <circle cx="607" cy="365" r="29" fill="#FFFDF5"/>
      <circle cx="614" cy="368" r="16.5" fill="#082D48"/>
      <circle cx="609" cy="361" r="6" fill="#FFFFFF"/>
      <circle cx="619" cy="375" r="2.6" fill="#FFFFFF" opacity="0.8"/>
      <ellipse cx="575" cy="410" rx="13" ry="7" fill="#74C6E1" opacity="0.42"/>
      <circle cx="658" cy="397" r="4.5" fill="#072F4C"/>
      <path d="M610 447C626 460 650 452 662 433" fill="none" stroke="#072F4C" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <g id="yellow-face">
    <circle cx="417" cy="659" r="29" fill="#FFFDF5"/>
    <circle cx="410" cy="656" r="16.5" fill="#082D48"/>
    <circle cx="405" cy="649" r="6" fill="#FFFFFF"/>
    <circle cx="415" cy="663" r="2.6" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="449" cy="614" rx="13" ry="7" fill="#F4A43B" opacity="0.55"/>
    <circle cx="366" cy="627" r="4.5" fill="#73521C"/>
    <path d="M414 577C398 564 374 572 362 591" fill="none" stroke="#73521C" stroke-width="8" stroke-linecap="round"/>
  </g>

  <circle cx="512" cy="512" r="440" fill="none" stroke="#FFFFFF" stroke-opacity="0.52" stroke-width="1.5"/>
</svg>
